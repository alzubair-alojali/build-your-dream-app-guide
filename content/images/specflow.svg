<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Specflow">
  <!-- Quiet Amber circle: the avatar mark used throughout the app. -->
  <circle cx="16" cy="16" r="16" fill="#e0a37a"/>
  <!-- Italic serif S in Dusk Walnut. Georgia is a serif with the right
       italic 'S' shape at favicon scale; the brand's Instrument Serif is
       not guaranteed to load in favicon-rendering contexts so we fall
       back through the standard serif stack. -->
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', 'Instrument Serif', serif"
    font-style="italic"
    font-weight="400"
    font-size="22"
    fill="#14110e"
  >S</text>
</svg>
